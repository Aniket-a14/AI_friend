services:
  # Heavy mode enables STT/voice runtime tuning for macOS.
  # GPT-SoVITS remains excluded here because its current image is CUDA-oriented.
  ollama:
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      NVIDIA_VISIBLE_DEVICES: ""
      NVIDIA_DRIVER_CAPABILITIES: ""

  gpt-sovits:
    profiles: ["linux-gpu"]

  voice_agent:
    profiles: ["linux-gpu"]
