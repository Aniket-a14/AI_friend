
services:
  # 1. Event Bus (NATS JetStream)
  nats:
    image: nats:${NATS_IMAGE_TAG:-2.10.24-alpine}
    container_name: nats_mesh
    entrypoint: [ "nats-server" ]
    command: [ "-js", "-m", "8222" ]
    ports:
      - "4222:4222" # Client connections
      - "8222:8222" # HTTP monitoring
    working_dir: /
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. PostgreSQL with PGVector (RAG + Conversation History)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    environment:
      POSTGRES_USER: ai_friend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_friend_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_friend -d ai_friend_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Neo4j (Knowledge Graph)
  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-5.26.0}
    container_name: brain_graph
    entrypoint: [ "tini", "-g", "--", "/startup/docker-entrypoint.sh" ]
    command: [ "neo4j" ]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: ${NEO4J_PLUGINS:-["apoc"]}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    working_dir: /var/lib/neo4j
    networks:
      - ai_mesh_network
    restart: always

  # 4. Redis (Caching + LiveKit Signaling)
  redis:
    image: redis:7-alpine
    container_name: brain_cache
    entrypoint: [ "docker-entrypoint.sh" ]
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    working_dir: /data
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. LiveKit (WebRTC SFU)
  livekit:
    image: livekit/livekit-server:${LIVEKIT_IMAGE_TAG:-v1.8.4}
    container_name: local_sfu
    entrypoint: [ "/livekit-server" ]
    command: [ "--config", "/etc/livekit.yaml" ]
    ports:
      - "7880:7880" # HTTP API
      - "7881:7881" # TURN/STUN TCP
      - "7882:7882" # Additional TCP
      - "3478:3478/udp" # STUN/TURN UDP
      - "50100-50120:50100-50120/udp" # WebRTC media ports
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_KEYS}"
    networks:
      - ai_mesh_network
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 6. Ollama (Local LLM)
  ollama:
    profiles: ["docker-ollama"]
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.5.7}
    container_name: local_brain
    entrypoint: [ "/bin/ollama" ]
    command: [ "serve" ]

    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 7. GPT-SoVITS (Local TTS) - Optimized for RTX-series GPUs
  gpt-sovits:
    build:
      context: ./backend
      dockerfile: Dockerfile.sovits
    container_name: local_voice
    environment:
      - is_half=true
      - CUDA_VISIBLE_DEVICES=0
      - LITE=true
      - WORKFLOW=true
      - PYTHONPATH=/workspace/GPT-SoVITS
      - CUSTOM_GPT_PATH=${CUSTOM_GPT_PATH:-GPT_weights/ai_friend_voice.ckpt}
      - CUSTOM_SOVITS_PATH=${CUSTOM_SOVITS_PATH:-SoVITS_weights/ai_friend_voice.pth}
    ports:
      - "9880:9880" # WebUI
      - "9871:9871" # API
    volumes:
      - voice_models:/workspace/models/pretrained_models
      - ./backend/voice_samples:/workspace/GPT-SoVITS/output
      - ./models/GPT_weights:/workspace/GPT-SoVITS/GPT_weights
      - ./models/SoVITS_weights:/workspace/GPT-SoVITS/SoVITS_weights
      - ./backend/scripts/bootstrap/sovits_bootstrap.sh:/workspace/sovits_bootstrap.sh
      - ./backend/scripts/bootstrap/sovits_healthcheck.sh:/workspace/sovits_healthcheck.sh
    shm_size: 16gb
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      # Real synthesis probe, not a status ping -- see sovits_healthcheck.sh
      # for why. `timeout` here (10s) must stay above the script's own -m 8
      # curl deadline, or Docker could kill the check before curl reports.
      test: ["CMD-SHELL", "bash /workspace/sovits_healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 500s

  # 8. Qdrant (Vector Database)
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: brain_vectors
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ai_mesh_network:
    name: ai_mesh_network
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  ollama_models:
  voice_models:
  qdrant_data:
