version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE (From docker-compose.infra.yml - re-declared for linking)
  # ---------------------------------------------------------------------------
  # In production, these might be external managed services.
  # For now, we assume they are running in the same network 'ai_mesh_network'

  # ---------------------------------------------------------------------------
  # AGENT MICROSERVICES
  # ---------------------------------------------------------------------------

  # 1. BRAIN AGENT (Logic, RAG, Ollama Client)
  brain_agent:
    build:
      context: ./backend
      target: slim
    container_name: brain_agent
    command: [ "python", "-m", "app.agents.brain_agent" ]
    volumes:
      - ./backend:/app # Development mount (remove in prod build)
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - OLLAMA_URL=http://local_brain:11434
      - DATABASE_URL=postgresql://ai_friend:${POSTGRES_PASSWORD}@postgres_db:5432/ai_friend_db
      - NEO4J_URI=bolt://brain_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_mesh_network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    healthcheck:
      test: ["NONE"]

  # 2. VOICE AGENT (TTS, connects to GPT-SoVITS)
  voice_agent:
    build:
      context: ./backend
      target: slim
    container_name: voice_agent
    command: [ "python", "-m", "app.agents.voice_agent" ]
    volumes:
      - ./backend:/app
      - ./backend/voice_samples:/app/output # For saving/reading WAVs
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - SOVITS_URL=http://local_voice:9871
    networks:
      - ai_mesh_network
    depends_on:
      - brain_agent
    restart: always
    healthcheck:
      test: ["NONE"]

  # 3. TRANSPORT AGENT (WebRTC Bridge)
  transport_agent:
    build:
      context: ./backend
      target: slim
    container_name: transport_agent
    command: [ "python", "-m", "app.agents.transport_agent" ]
    volumes:
      - ./backend:/app
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - LIVEKIT_URL=http://local_sfu:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    networks:
      - ai_mesh_network
    depends_on:
      - brain_agent
    restart: always
    healthcheck:
      test: ["NONE"]

  # 4. STT AGENT (Whisper, VAD) - Heavy
  stt_agent:
    build:
      context: ./backend
      target: full
    container_name: stt_agent
    command: [ "python", "-m", "app.agents.stt_agent" ]
    volumes:
      - ./backend:/app
      - ./backend/models:/app/models # Persist models
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - STT_MODEL_SIZE=small
      - STT_DEVICE=cpu
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - ai_mesh_network
    depends_on:
      - brain_agent
    restart: always
    healthcheck:
      test: ["NONE"]

  # 5. VISION AGENT (OpenCV, Screen/Cam) - Heavy
  vision_agent:
    build:
      context: ./backend
      target: full
    container_name: vision_agent
    command: [ "python", "-m", "app.agents.vision_agent" ]
    volumes:
      - ./backend:/app
    environment:
      - NATS_URL=nats://nats_mesh:4222
    networks:
      - ai_mesh_network
    depends_on:
      - brain_agent
    restart: always
    healthcheck:
      test: ["NONE"]

# Use the existing network created by infra
networks:
  ai_mesh_network:
    external: true
