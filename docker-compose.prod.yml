
services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE (From docker-compose.infra.yml - re-declared for linking)
  # ---------------------------------------------------------------------------
  # In production, these might be external managed services.
  # For now, we assume they are running in the same network 'ai_mesh_network'

  # ---------------------------------------------------------------------------
  # AGENT MICROSERVICES
  # ---------------------------------------------------------------------------

  # 1. BRAIN AGENT (Logic, RAG, Ollama Client)
  brain_agent:
    build:
      context: ./backend
      target: slim
    container_name: brain_agent
    command: [ "python", "-m", "app.agents.brain_agent" ]
    volumes:
      - ./backend:/app # Development mount (remove in prod build)
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - OLLAMA_URL=http://local_brain:11434
      - DATABASE_URL=postgresql://ai_friend:${POSTGRES_PASSWORD}@postgres_db:5432/ai_friend_db
      - NEO4J_URI=bolt://brain_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - SYSTEM_TICK_INTERVAL=${SYSTEM_TICK_INTERVAL:-60}
      - STATE_SENSORY_WEIGHT=${STATE_SENSORY_WEIGHT:-0.20}
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_started
      neo4j:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. VOICE AGENT (TTS, connects to GPT-SoVITS)
  voice_agent:
    build:
      context: ./backend
      target: slim
    container_name: voice_agent
    command: [ "python", "-m", "app.voice.agent" ]
    volumes:
      - ./backend:/app
      - ./backend/voice_samples:/app/output # For saving/reading WAVs
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - SOVITS_URL=http://local_voice:9871
      - MAX_VOICE_QUEUE_SIZE=${MAX_VOICE_QUEUE_SIZE:-10}
      - VOICE_SYNTH_CONCURRENCY=${VOICE_SYNTH_CONCURRENCY:-1}
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
      nats:
        condition: service_started
      gpt-sovits:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. TRANSPORT AGENT (WebRTC Bridge)
  transport_agent:
    build:
      context: ./backend
      target: slim
    container_name: transport_agent
    command: [ "python", "-m", "app.agents.transport_agent" ]
    volumes:
      - ./backend:/app
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - LIVEKIT_URL=http://local_sfu:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. STT AGENT (Whisper, VAD) - Heavy
  stt_agent:
    build:
      context: ./backend
      target: full
    container_name: stt_agent
    command: [ "python", "-m", "app.stt.agent" ]
    volumes:
      - ./backend:/app
      - ./backend/models:/app/models # Persist models
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - STT_MODEL_SIZE=small
      - STT_DEVICE=cpu
      - INTENT_THRESHOLD=${INTENT_THRESHOLD:-0.75}
      - STT_WHISPER_QUEUE_SIZE=${STT_WHISPER_QUEUE_SIZE:-8}
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. VISION AGENT (OpenCV, Screen/Cam) - Heavy
  vision_agent:
    build:
      context: ./backend
      target: full
    container_name: vision_agent
    command: [ "python", "-m", "app.agents.vision_agent" ]
    volumes:
      - ./backend:/app
    environment:
      - NATS_URL=nats://nats_mesh:4222
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

# Use the existing network created by infra
networks:
  ai_mesh_network:
    external: true
