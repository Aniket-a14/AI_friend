
services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE (From docker-compose.infra.yml - redeclared for linking)
  # ---------------------------------------------------------------------------
  # In production, these might be external managed services.
  # For now, we assume they are running in the same network 'ai_mesh_network'

  # ---------------------------------------------------------------------------
  # AGENT MICROSERVICES
  # ---------------------------------------------------------------------------

  # 1. BRAIN AGENT (Logic, RAG, Ollama Client)
  brain_agent:
    build:
      context: ./backend
      target: slim
    container_name: brain_agent
    command: [ "python", "-m", "app.agents.brain_agent" ]
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - OLLAMA_URL=${OLLAMA_URL:-http://local_brain:11434}
      - LLM_FAST_MODEL=${LLM_FAST_MODEL:-llama3.2:3b}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-llama3.2:3b}
      - LLM_REFLECTION_MODEL=${LLM_REFLECTION_MODEL:-llama3.2:3b}
      - LLM_INTENT_CLASSIFICATION_ENABLED=${LLM_INTENT_CLASSIFICATION_ENABLED:-false}
      - REFLECTION_ENABLED=${REFLECTION_ENABLED:-true}
      - REFLECTION_MIN_INTERVAL_SECONDS=${REFLECTION_MIN_INTERVAL_SECONDS:-300}
      - RUNTIME_AUTO_BOOTSTRAP=${RUNTIME_AUTO_BOOTSTRAP:-true}
      - RUNTIME_BOOTSTRAP_RETRIES=${RUNTIME_BOOTSTRAP_RETRIES:-15}
      - OLLAMA_REQUIRED_MODELS=${OLLAMA_REQUIRED_MODELS:-llama3.2:3b,nomic-embed-text}
      - DATABASE_URL=postgresql://ai_friend:${POSTGRES_PASSWORD}@postgres_db:5432/ai_friend_db
      - NEO4J_URI=bolt://brain_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - SYSTEM_TICK_INTERVAL=${SYSTEM_TICK_INTERVAL:-60}
      - STATE_SENSORY_WEIGHT=${STATE_SENSORY_WEIGHT:-0.20}
      - PROACTIVE_ENABLED=${PROACTIVE_ENABLED:-true}
      - PROACTIVE_IDLE_THRESHOLD_SECONDS=${PROACTIVE_IDLE_THRESHOLD_SECONDS:-7200}
      - PROACTIVE_COOLDOWN_SECONDS=${PROACTIVE_COOLDOWN_SECONDS:-3600}
      - PROACTIVE_MIN_ENERGY=${PROACTIVE_MIN_ENERGY:-0.2}
      - LOG_LEVEL=INFO
      - QDRANT_HOST=brain_vectors
      - MOCK_LLM_TEXT=${MOCK_LLM_TEXT:-false}
      # #113 / H2: runtime persona evolution (IdentityManager.save()'s fallback
      # when agent_configs is unreachable) needs to land on a volume, not the
      # image's writable layer, or a redeploy silently resets it.
      - IDENTITY_BASE_PATH=/app/data
    volumes:
      - identity_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

    deploy:
      resources:
        # E2: brain_agent is the only service in this file with an explicit cap,
        # yet it's the heaviest one - the full cognitive pipeline (asyncpg pool,
        # neo4j bolt driver, embedding/LLM HTTP buffers, in-process memory cache)
        # runs here, while every sibling service below has no limit at all. 512M
        # was measured tight even in a light benchmark run; give it real headroom
        # instead of a cap likely to OOM-kill mid-session under sustained load.
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. SYSTEM AGENT (Heartbeat / system.tick publisher)
  system_agent:
    build:
      context: ./backend
      target: slim
    container_name: system_agent
    command: [ "python", "-m", "app.agents.system_agent" ]
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - SYSTEM_TICK_INTERVAL=${SYSTEM_TICK_INTERVAL:-60}
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2.5. SUBCONSCIOUS AGENT (Background proactive thought generator)
  subconscious_agent:
    build:
      context: ./backend
      target: slim
    container_name: subconscious_agent
    command: [ "python", "-m", "app.agents.subconscious_agent" ]
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - OLLAMA_URL=${OLLAMA_URL:-http://local_brain:11434}
      - DATABASE_URL=postgresql://ai_friend:${POSTGRES_PASSWORD}@postgres_db:5432/ai_friend_db
      - NEO4J_URI=bolt://brain_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - PROACTIVE_ENABLED=${PROACTIVE_ENABLED:-true}
      - PROACTIVE_IDLE_THRESHOLD_SECONDS=${PROACTIVE_IDLE_THRESHOLD_SECONDS:-7200}
      - PROACTIVE_COOLDOWN_SECONDS=${PROACTIVE_COOLDOWN_SECONDS:-3600}
      - PROACTIVE_MIN_ENERGY=${PROACTIVE_MIN_ENERGY:-0.2}
      - LOG_LEVEL=INFO
      - QDRANT_HOST=brain_vectors
      - MOCK_LLM_TEXT=${MOCK_LLM_TEXT:-false}
      # #113 / H2: ReflectionService's IdentityManager fallback needs the same
      # persistent, non-image-layer location brain_agent uses above.
      - IDENTITY_BASE_PATH=/app/data
    volumes:
      - identity_data:/app/data
    networks:
      - ai_mesh_network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      system_agent:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. SURFACING AGENT (Proactive memory recall)
  surfacing_agent:
    build:
      context: ./backend
      target: slim
    container_name: surfacing_agent
    command: [ "python", "-m", "app.agents.surfacing_agent" ]
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - OLLAMA_URL=${OLLAMA_URL:-http://local_brain:11434}
      - DATABASE_URL=postgresql://ai_friend:${POSTGRES_PASSWORD}@postgres_db:5432/ai_friend_db
      - NEO4J_URI=bolt://brain_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_HOST=brain_vectors
      - MOCK_LLM_TEXT=${MOCK_LLM_TEXT:-false}
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      brain_agent:
        condition: service_healthy
      system_agent:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. VOICE AGENT (TTS, connects to GPT-SoVITS) - Rust-based Default
  voice_agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.rust
      target: runtime
    container_name: voice_agent
    command: [ "voice-agent" ]
    volumes:
      - voice_samples_data:/app/output
      - ./models:/app/models
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - SOVITS_URL=http://local_voice:9871
      - TTS_LANGUAGE=${TTS_LANGUAGE:-en}
      - SAMPLE_RATE=${SAMPLE_RATE:-32000}
      - REF_AUDIO_PATH=${REF_AUDIO_PATH:-output/sample_en_gold.wav}
      - REF_TEXT=${REF_TEXT:-At the end of the exam, the program shows the performance summary.}
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
      nats:
        condition: service_healthy
      gpt-sovits:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


  # 5. TRANSPORT AGENT (WebRTC Bridge)
  transport_agent:
    build:
      context: ./backend
      target: slim
    container_name: transport_agent
    command: [ "python", "-m", "app.agents.transport_agent" ]
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - LIVEKIT_URL=ws://local_sfu:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - TRANSPORT_AUDIO_QUEUE_SIZE=${TRANSPORT_AUDIO_QUEUE_SIZE:-1024}
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
      livekit:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. STT AGENT (real recognition, dual-path)
  #
  # The accurate path is whisper.cpp (STT_ACCURATE_MODEL -> final chat.input
  # transcript). The fast path prefers SenseVoice (sherpa-onnx), which classifies
  # speech emotion and audio events (laughter, coughing, ...) alongside the words —
  # the acoustic half of the affect pillar. When no SenseVoice model is mounted the
  # fast path falls back to a small Whisper model (STT_FAST_MODEL): barge-in still
  # works, but the agent hears words without tone, and says so loudly in its logs.
  #
  # Whisper ggml weights are downloaded on first boot into the stt_models_data
  # volume (~220MB). The SenseVoice model is provisioned on the HOST — run
  # `python backend/scripts/bootstrap/provision_models.py` once — and bind-mounted
  # read-only below; the agent does not download it.
  #
  # Set STT_BACKEND=mock (plus RUST_STT_MOCK_TRANSCRIPT) only for CI/offline runs
  # where no model download is possible — it replays a fixed string and is NOT
  # real perception.
  stt_agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.rust
      target: runtime
    container_name: stt_agent
    command: [ "stt-agent" ]
    volumes:
      - stt_models_data:/app/models
      - ./backend/models/sensevoice:/app/models/sensevoice:ro
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - STT_BACKEND=${STT_BACKEND:-whisper}
      - STT_MODEL_DIR=${STT_MODEL_DIR:-/app/models/whisper}
      - STT_SENSEVOICE=${STT_SENSEVOICE:-on}
      - STT_SENSEVOICE_DIR=${STT_SENSEVOICE_DIR:-/app/models/sensevoice}
      - STT_FAST_MODEL=${STT_FAST_MODEL:-tiny.en}
      - STT_ACCURATE_MODEL=${STT_ACCURATE_MODEL:-base.en}
      - STT_LANGUAGE=${STT_LANGUAGE:-en}
      # Fallback only; the true rate is read from the audio.inbound header.
      - STT_TARGET_SAMPLE_RATE=${STT_TARGET_SAMPLE_RATE:-16000}
      - STT_ENDPOINT_SILENCE_MS=${STT_ENDPOINT_SILENCE_MS:-700}
      - STT_MIN_SPEECH_MS=${STT_MIN_SPEECH_MS:-250}
      - STT_PARTIAL_INTERVAL_MS=${STT_PARTIAL_INTERVAL_MS:-500}
      - STT_MAX_UTTERANCE_SECS=${STT_MAX_UTTERANCE_SECS:-30}
      - RUST_STT_MOCK_TRANSCRIPT=${RUST_STT_MOCK_TRANSCRIPT:-}
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: always
    # Was: [ -n "${RUST_STT_MOCK_TRANSCRIPT}" ] && nc -z nats_mesh 4222 || exit 1
    # That was broken twice over: Compose interpolates ${...} at parse time from the
    # HOST env (so it never tested the container), and because the var is undefined
    # in .env.example it collapsed to `[ -n "" ] && ... || exit 1` — i.e. the probe
    # reported unhealthy unconditionally. Use the same liveness probe as every other
    # service in the mesh.
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


  # 7. VISION AGENT (OpenCV, Screen/Cam) - Heavy
  #
  # OPT-IN, AND LINUX-HOST ONLY. Start with:
  #     docker compose --profile vision up vision_agent
  #
  # Capture is host-bound and cannot be containerised on every platform. This
  # was verified rather than assumed, on a Windows host with a Linux Docker
  # engine:
  #   - /dev/video* does not exist in the container (no camera)
  #   - `--device=/dev/video0` is rejected by the daemon outright
  #   - /tmp/.X11-unix is absent and DISPLAY is unset (no screen)
  #   - mss itself fails with "Library libxcb.so not found"
  # On a Windows or macOS host the container runs inside a Linux VM with no
  # route to the host's display or USB webcam, so no amount of configuration
  # fixes this. RUN THE AGENT ON THE HOST INSTEAD:
  #     pip install -r backend/requirements-ai.txt
  #     NATS_URL=nats://127.0.0.1:4222 python -m app.vision.agent
  #
  # On a LINUX host the passthrough below does work: uncomment the `devices`
  # entry for camera capture, and/or the X11 mount plus DISPLAY for screen
  # capture. Both are commented out because a missing device makes the whole
  # service fail to start on hosts that do not have it.
  #
  # The healthcheck deliberately probes the sentinel the agent touches on each
  # successful capture, not `pgrep python` — a blind agent keeps its process
  # alive perfectly well, which is how finding E1 hid a stubbed STT for so long.
  vision_agent:
    profiles: [ vision ]
    build:
      context: ./backend
      target: full
    container_name: vision_agent
    command: [ "python", "-m", "app.vision.agent" ]
    env_file: .env
    environment:
      - AGENT_NAME=vision_agent
      - NATS_URL=nats://nats_mesh:4222
      - OLLAMA_URL=${OLLAMA_URL}
      - VISION_HEALTH_FILE=/tmp/vision_agent_healthy
      # Linux host + screen capture: also uncomment the X11 volume below.
      # - DISPLAY=${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:ro
    # devices:
    #   - /dev/video0:/dev/video0
    depends_on:
      nats:
        condition: service_started
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/vision_agent_healthy && test $(( $(date +%s) - $(stat -c %Y /tmp/vision_agent_healthy) )) -lt 60 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Use the existing network created by infra
networks:
  ai_mesh_network:
    external: true

volumes:
  voice_samples_data:
  stt_models_data:
  identity_data:
