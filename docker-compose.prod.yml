
services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE (From docker-compose.infra.yml - redeclared for linking)
  # ---------------------------------------------------------------------------
  # In production, these might be external managed services.
  # For now, we assume they are running in the same network 'ai_mesh_network'

  # ---------------------------------------------------------------------------
  # AGENT MICROSERVICES
  # ---------------------------------------------------------------------------

  # 1. BRAIN AGENT (Logic, RAG, Ollama Client)
  brain_agent:
    build:
      context: ./backend
      target: slim
    container_name: brain_agent
    command: [ "python", "-m", "app.agents.brain_agent" ]
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - OLLAMA_URL=${OLLAMA_URL:-http://local_brain:11434}
      - LLM_FAST_MODEL=${LLM_FAST_MODEL:-llama3.2:3b}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-llama3.2:3b}
      - LLM_REFLECTION_MODEL=${LLM_REFLECTION_MODEL:-llama3.2:3b}
      - LLM_INTENT_CLASSIFICATION_ENABLED=${LLM_INTENT_CLASSIFICATION_ENABLED:-false}
      - REFLECTION_ENABLED=${REFLECTION_ENABLED:-true}
      - REFLECTION_MIN_INTERVAL_SECONDS=${REFLECTION_MIN_INTERVAL_SECONDS:-300}
      - RUNTIME_AUTO_BOOTSTRAP=${RUNTIME_AUTO_BOOTSTRAP:-true}
      - RUNTIME_BOOTSTRAP_RETRIES=${RUNTIME_BOOTSTRAP_RETRIES:-15}
      - OLLAMA_REQUIRED_MODELS=${OLLAMA_REQUIRED_MODELS:-llama3.2:3b,nomic-embed-text}
      - DATABASE_URL=postgresql://ai_friend:${POSTGRES_PASSWORD}@postgres_db:5432/ai_friend_db
      - NEO4J_URI=bolt://brain_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - SYSTEM_TICK_INTERVAL=${SYSTEM_TICK_INTERVAL:-60}
      - STATE_SENSORY_WEIGHT=${STATE_SENSORY_WEIGHT:-0.20}
      - PROACTIVE_ENABLED=${PROACTIVE_ENABLED:-true}
      - PROACTIVE_IDLE_THRESHOLD_SECONDS=${PROACTIVE_IDLE_THRESHOLD_SECONDS:-7200}
      - PROACTIVE_COOLDOWN_SECONDS=${PROACTIVE_COOLDOWN_SECONDS:-3600}
      - PROACTIVE_MIN_ENERGY=${PROACTIVE_MIN_ENERGY:-0.2}
      - LOG_LEVEL=INFO
      - QDRANT_HOST=brain_vectors
      - MOCK_LLM_TEXT=${MOCK_LLM_TEXT:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. SYSTEM AGENT (Heartbeat / system.tick publisher)
  system_agent:
    build:
      context: ./backend
      target: slim
    container_name: system_agent
    command: [ "python", "-m", "app.agents.system_agent" ]
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - SYSTEM_TICK_INTERVAL=${SYSTEM_TICK_INTERVAL:-60}
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2.5. SUBCONSCIOUS AGENT (Background proactive thought generator)
  subconscious_agent:
    build:
      context: ./backend
      target: slim
    container_name: subconscious_agent
    command: [ "python", "-m", "app.agents.subconscious_agent" ]
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - OLLAMA_URL=${OLLAMA_URL:-http://local_brain:11434}
      - DATABASE_URL=postgresql://ai_friend:${POSTGRES_PASSWORD}@postgres_db:5432/ai_friend_db
      - NEO4J_URI=bolt://brain_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - PROACTIVE_ENABLED=${PROACTIVE_ENABLED:-true}
      - PROACTIVE_IDLE_THRESHOLD_SECONDS=${PROACTIVE_IDLE_THRESHOLD_SECONDS:-7200}
      - PROACTIVE_COOLDOWN_SECONDS=${PROACTIVE_COOLDOWN_SECONDS:-3600}
      - PROACTIVE_MIN_ENERGY=${PROACTIVE_MIN_ENERGY:-0.2}
      - LOG_LEVEL=INFO
      - QDRANT_HOST=brain_vectors
      - MOCK_LLM_TEXT=${MOCK_LLM_TEXT:-false}
    networks:
      - ai_mesh_network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      system_agent:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. SURFACING AGENT (Proactive memory recall)
  surfacing_agent:
    build:
      context: ./backend
      target: slim
    container_name: surfacing_agent
    command: [ "python", "-m", "app.agents.surfacing_agent" ]
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - OLLAMA_URL=${OLLAMA_URL:-http://local_brain:11434}
      - DATABASE_URL=postgresql://ai_friend:${POSTGRES_PASSWORD}@postgres_db:5432/ai_friend_db
      - NEO4J_URI=bolt://brain_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_HOST=brain_vectors
      - MOCK_LLM_TEXT=${MOCK_LLM_TEXT:-false}
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      brain_agent:
        condition: service_healthy
      system_agent:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. VOICE AGENT (TTS, connects to GPT-SoVITS) - Rust-based Default
  voice_agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.rust
      target: runtime
    container_name: voice_agent
    command: [ "voice-agent" ]
    volumes:
      - voice_samples_data:/app/output
      - ./models:/app/models
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - SOVITS_URL=http://local_voice:9871
      - TTS_LANGUAGE=${TTS_LANGUAGE:-en}
      - SAMPLE_RATE=${SAMPLE_RATE:-32000}
      - REF_AUDIO_PATH=${REF_AUDIO_PATH:-output/sample_en_gold.wav}
      - REF_TEXT=${REF_TEXT:-At the end of the exam, the program shows the performance summary.}
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
      nats:
        condition: service_healthy
      gpt-sovits:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


  # 5. TRANSPORT AGENT (WebRTC Bridge)
  transport_agent:
    build:
      context: ./backend
      target: slim
    container_name: transport_agent
    command: [ "python", "-m", "app.agents.transport_agent" ]
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - LIVEKIT_URL=http://local_sfu:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - TRANSPORT_AUDIO_QUEUE_SIZE=${TRANSPORT_AUDIO_QUEUE_SIZE:-1024}
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
      livekit:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. STT AGENT (real Whisper recognition, dual-path)
  #
  # Runs whisper.cpp via whisper-rs. Two models fan out: STT_FAST_MODEL drives
  # low-latency speculative partials on audio.perception (barge-in), while
  # STT_ACCURATE_MODEL produces the final chat.input transcript.
  #
  # Models are downloaded on first boot into the stt_models_data volume, mirroring
  # how Ollama models are provisioned. First start is slower while ~220MB of ggml
  # weights are fetched; subsequent starts hit the cache.
  #
  # Set STT_BACKEND=mock (plus RUST_STT_MOCK_TRANSCRIPT) only for CI/offline runs
  # where no model download is possible — it replays a fixed string and is NOT
  # real perception.
  stt_agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.rust
      target: runtime
    container_name: stt_agent
    command: [ "stt-agent" ]
    volumes:
      - stt_models_data:/app/models
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - STT_BACKEND=${STT_BACKEND:-whisper}
      - STT_MODEL_DIR=${STT_MODEL_DIR:-/app/models/whisper}
      - STT_FAST_MODEL=${STT_FAST_MODEL:-tiny.en}
      - STT_ACCURATE_MODEL=${STT_ACCURATE_MODEL:-base.en}
      - STT_LANGUAGE=${STT_LANGUAGE:-en}
      # Fallback only; the true rate is read from the audio.inbound header.
      - STT_TARGET_SAMPLE_RATE=${STT_TARGET_SAMPLE_RATE:-16000}
      - STT_ENDPOINT_SILENCE_MS=${STT_ENDPOINT_SILENCE_MS:-700}
      - STT_MIN_SPEECH_MS=${STT_MIN_SPEECH_MS:-250}
      - STT_PARTIAL_INTERVAL_MS=${STT_PARTIAL_INTERVAL_MS:-500}
      - STT_MAX_UTTERANCE_SECS=${STT_MAX_UTTERANCE_SECS:-30}
      - RUST_STT_MOCK_TRANSCRIPT=${RUST_STT_MOCK_TRANSCRIPT:-}
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: always
    # Was: [ -n "${RUST_STT_MOCK_TRANSCRIPT}" ] && nc -z nats_mesh 4222 || exit 1
    # That was broken twice over: Compose interpolates ${...} at parse time from the
    # HOST env (so it never tested the container), and because the var is undefined
    # in .env.example it collapsed to `[ -n "" ] && ... || exit 1` — i.e. the probe
    # reported unhealthy unconditionally. Use the same liveness probe as every other
    # service in the mesh.
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


  # 7. VISION AGENT (OpenCV, Screen/Cam) - Heavy
#  vision_agent:
#    build:
#      context: ./backend
#      target: full
#    container_name: vision_agent
#    command: [ "python", "-m", "app.vision.agent" ]
#    env_file: .env
#    environment:
#      - AGENT_NAME=vision_agent
#      - NATS_URL=nats://nats_mesh:4222
#      - OLLAMA_URL=${OLLAMA_URL}
