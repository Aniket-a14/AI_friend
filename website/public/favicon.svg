<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #111111; }
      .stroke-main { stroke: #F5F4F0; }
      .accent { fill: #10B981; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #F5F4F0; }
      .stroke-main { stroke: #111111; }
      .accent { fill: #059669; }
    }
  </style>

  <!-- Squircle Base Canvas -->
  <rect class="bg" width="512" height="512" rx="116" />

  <!-- Fluid P & A Intertwined Friendship Monogram -->
  <g class="stroke-main" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- P-Stem and Outer Loop -->
    <path d="M 160 340 V 190 C 160 145, 230 145, 260 185 C 290 225, 255 285, 195 285 H 160" />
    
    <!-- P-Loop into A-Arch Transition Ribbon -->
    <path d="M 235 240 C 275 240, 310 180, 335 210 C 355 235, 330 295, 275 320" />
    
    <!-- A-Right Leg and Cross-connection -->
    <path d="M 320 200 L 375 340" />
    <path d="M 245 285 H 345" stroke-width="20" />
  </g>

  <!-- Living Presence Pulse Dot -->
  <circle class="accent" cx="256" cy="120" r="10" />
</svg>