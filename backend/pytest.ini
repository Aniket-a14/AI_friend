# Pytest Configuration for AI Friend Sovereign Mesh

[pytest]
testpaths = tests
pythonpath = .
norecursedirs = legacy __pycache__ .venv .git .hypothesis .tox build dist
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    benchmark: performance benchmark tests for hot paths
    latency: latency-oriented deterministic guard tests

filterwarnings =
    ignore:pkg_resources is deprecated as an API:UserWarning
