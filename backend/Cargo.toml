[workspace]
members = [
    "crates/contracts",
    "crates/voice-agent",
    "crates/stt-agent",
    "crates/cognitive-rust",
]
resolver = "2"

[workspace.package]
version = "7.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-nats = "0.44"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
contracts = { path = "crates/contracts" }
futures-util = "0.3"
pyo3 = { version = "0.28.3", features = ["extension-module", "abi3-py39"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rubato = "0.16"
serde = { version = "1.0", features = ["derive"] }
# P2-12: SHA256-verifying downloaded whisper weights, mirroring
# provision_models.py's existing SenseVoice pin.
sha2 = "0.10"
serde_json = "1.0"
# SenseVoice (emotion + audio-event recognition). Whisper cannot run it: SenseVoice
# is a sherpa-onnx model, which is why the acoustic-affect half of the perception
# pipeline was dead after the Rust migration.
#
# `shared` (not the default `static`) is required because this binary also links
# whisper.cpp. sherpa's prebuilt static archive is built against the static MSVC
# runtime (/MT) while whisper-rs-sys compiles whisper.cpp against the dynamic one
# (/MD); linking both statically fails with LNK2038 RuntimeLibrary mismatches.
# Dynamic linking sidesteps that and costs a shipped shared library, which
# Dockerfile.rust already does for ONNX Runtime.
sherpa-onnx = { version = "1.13.4", default-features = false, features = ["shared"] }
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
whisper-rs = "0.16"
