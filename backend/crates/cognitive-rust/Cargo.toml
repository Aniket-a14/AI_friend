[package]
name = "cognitive-rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cognitive_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Requested by maturin via ../../pyproject.toml's [tool.maturin] `features`
# for the real wheel build -- never enabled for `cargo test`/`cargo check`,
# which is the whole point (see the comment on the workspace pyo3 entry).
extension-module = ["pyo3/extension-module"]
