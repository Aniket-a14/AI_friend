name: Production Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Base Image (ai-friend/base)
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile.base
        push: false
        tags: ai-friend/base:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Validate Production Compose Config
      run: |
        # Create dummy .env for config check (values don't matter for 'config' command)
        touch .env
        echo "LIVEKIT_API_KEY=dummy" >> .env
        echo "LIVEKIT_API_SECRET=dummy" >> .env
        echo "POSTGRES_PASSWORD=dummy" >> .env
        echo "NEO4J_AUTH=neo4j/dummy" >> .env
        echo "DATABASE_URL=postgresql://dummy" >> .env
        
        # Verify the compose files parse correctly together
        docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml config
