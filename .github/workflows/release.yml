name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Retrieve full history for git log computation

      - name: Generate Advanced Categorized Changelog
        id: changelog
        shell: bash
        run: |
          git fetch --tags
          CURRENT_TAG=${{ github.ref_name }}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")
          
          echo "### 🚀 Release $CURRENT_TAG - Release Notes" > release_notes.md
          echo "" >> release_notes.md
          
          # Compute Git Logs
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"%s (%h)")
          else
            COMMITS=$(git log $PREVIOUS_TAG..$CURRENT_TAG --oneline --pretty=format:"%s (%h)")
          fi
          
          # Initialize Categories
          FEATS=""
          FIXES=""
          PERFS=""
          REFACTORS=""
          DOCS=""
          CHORES=""
          
          # Parse and group commits
          IFS=$'\n'
          for commit in $COMMITS; do
            if [[ "$commit" =~ ^feat ]]; then
              FEATS="$FEATS* $commit\n"
            elif [[ "$commit" =~ ^fix ]]; then
              FIXES="$FIXES* $commit\n"
            elif [[ "$commit" =~ ^perf ]]; then
              PERFS="$PERFS* $commit\n"
            elif [[ "$commit" =~ ^refactor ]]; then
              REFACTORS="$REFACTORS* $commit\n"
            elif [[ "$commit" =~ ^docs ]]; then
              DOCS="$DOCS* $commit\n"
            else
              CHORES="$CHORES* $commit\n"
            fi
          done
          
          # Write Sections
          if [ ! -z "$FEATS" ]; then
            echo -e "### ✨ Features\n$FEATS" >> release_notes.md
          fi
          if [ ! -z "$FIXES" ]; then
            echo -e "### 🐛 Bug Fixes\n$FIXES" >> release_notes.md
          fi
          if [ ! -z "$PERFS" ]; then
            echo -e "### ⚡ Performance\n$PERFS" >> release_notes.md
          fi
          if [ ! -z "$REFACTORS" ]; then
            echo -e "### 🔨 Refactoring\n$REFACTORS" >> release_notes.md
          fi
          if [ ! -z "$DOCS" ]; then
            echo -e "### 📝 Documentation\n$DOCS" >> release_notes.md
          fi
          if [ ! -z "$CHORES" ]; then
            echo -e "### ⚙️ Maintenance & Tooling\n$CHORES" >> release_notes.md
          fi
          
          # Ensure trailing newline and pipe to GITHUB_OUTPUT
          echo "" >> release_notes.md
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -dc 'a-zA-Z0-9')
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: AI Friend ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: false

  build-assets:
    needs: [release]
    strategy:
      matrix:
        environment: [development, staging, production]
        include:
          # ----- Windows Targets -----
          - os: windows-latest
            platform_name: win
            arch: x64
            archive_ext: zip
          - os: windows-latest
            platform_name: win
            arch: x86
            archive_ext: zip
          - os: windows-latest
            platform_name: win
            arch: arm64
            archive_ext: zip

          # ----- macOS Targets -----
          - os: macos-latest
            platform_name: macos
            arch: arm64
            archive_ext: zip
          - os: macos-latest
            platform_name: macos
            arch: x64
            archive_ext: zip

          # ----- Linux Targets -----
          - os: ubuntu-latest
            platform_name: linux
            arch: x86_64
            archive_ext: tar.gz
          - os: ubuntu-latest
            platform_name: linux
            arch: arm64
            archive_ext: tar.gz
          - os: ubuntu-latest
            platform_name: linux
            arch: 386
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Target Environment Parameters
        shell: bash
        run: |
          if [ "${{ matrix.environment }}" = "development" ]; then
            echo "ENV_SUFFIX=-dev" >> $GITHUB_ENV
            echo "CONFIG_URL=http://localhost:8000" >> $GITHUB_ENV
          elif [ "${{ matrix.environment }}" = "staging" ]; then
            echo "ENV_SUFFIX=-staging" >> $GITHUB_ENV
            echo "CONFIG_URL=https://staging.ai-friend.local" >> $GITHUB_ENV
          else
            echo "ENV_SUFFIX=" >> $GITHUB_ENV
            echo "CONFIG_URL=https://api.ai-friend.com" >> $GITHUB_ENV
          fi

      - name: Build Application Directory Structure
        shell: bash
        run: |
          mkdir -p build_dist/backend
          mkdir -p build_dist/frontend
          
          # Copy source trees
          cp -r backend/app build_dist/backend/
          echo "API_URL=${{ env.CONFIG_URL }}" > build_dist/frontend/.env
          cp LICENSE build_dist/ 2>/dev/null || true

      - name: Generate Software Bill of Materials (SBOM)
        shell: bash
        run: |
          # Generate structured SPDX SBOM list of dependencies
          cat <<EOF > build_dist/sbom.json
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.4",
            "component": {
              "name": "ai-friend",
              "version": "${{ github.ref_name }}",
              "type": "application"
            },
            "dependencies": [
              { "ref": "python", "version": "3.11" },
              { "ref": "fastapi", "version": "0.109.0" },
              { "ref": "nextjs", "version": "14.1.0" },
              { "ref": "livekit-rtc", "version": "0.8.0" }
            ]
          }
          EOF

      - name: Generate Offline CHANGELOG.md
        shell: bash
        run: |
          git fetch --tags
          CURRENT_TAG=${{ github.ref_name }}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")
          
          echo "# Changelog - $CURRENT_TAG" > build_dist/CHANGELOG.md
          echo "" >> build_dist/CHANGELOG.md
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial release of AI Friend!" >> build_dist/CHANGELOG.md
            echo "" >> build_dist/CHANGELOG.md
            git log --oneline --pretty=format:"* %s (%h)" >> build_dist/CHANGELOG.md
          else
            echo "Commits since previous release ($PREVIOUS_TAG):" >> build_dist/CHANGELOG.md
            echo "" >> build_dist/CHANGELOG.md
            git log $PREVIOUS_TAG..$CURRENT_TAG --oneline --pretty=format:"* %s (%h)" >> build_dist/CHANGELOG.md
          fi

      - name: Generate Release Metadata JSON
        shell: bash
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat <<EOF > build_dist/metadata.json
          {
            "version": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "timestamp": "$TIMESTAMP",
            "platform": "${{ matrix.platform_name }}"
          }
          EOF

      # ----------------- WINDOWS MULTIPLE INSTALLERS -----------------
      - name: Build Windows ZIP
        if: matrix.platform_name == 'win'
        shell: pwsh
        run: |
          Compress-Archive -Path build_dist\* -DestinationPath "ai-friend${{ env.ENV_SUFFIX }}-win-${{ matrix.arch }}.zip"

      - name: Build Windows EXE & MSI Installer Placeholders
        if: matrix.platform_name == 'win'
        shell: pwsh
        run: |
          New-Item "ai-friend${{ env.ENV_SUFFIX }}-win-${{ matrix.arch }}.exe" -ItemType File -Value "EXE ${{ matrix.arch }} Placeholder"
          New-Item "ai-friend${{ env.ENV_SUFFIX }}-win-${{ matrix.arch }}.msi" -ItemType File -Value "MSI ${{ matrix.arch }} Placeholder"

      # ----------------- MACOS MULTIPLE INSTALLERS -----------------
      - name: Build macOS ZIP
        if: matrix.platform_name == 'macos'
        shell: bash
        run: |
          zip -r "ai-friend${{ env.ENV_SUFFIX }}-mac-${{ matrix.arch }}.zip" build_dist/*

      - name: Build macOS DMG & PKG Placeholders
        if: matrix.platform_name == 'macos'
        shell: bash
        run: |
          echo "DMG ${{ matrix.arch }} Placeholder" > "ai-friend${{ env.ENV_SUFFIX }}-mac-${{ matrix.arch }}.dmg"
          echo "PKG ${{ matrix.arch }} Placeholder" > "ai-friend${{ env.ENV_SUFFIX }}-mac-${{ matrix.arch }}.pkg"

      # ----------------- LINUX MULTIPLE INSTALLERS -----------------
      - name: Build Linux TAR.GZ
        if: matrix.platform_name == 'linux'
        shell: bash
        run: |
          tar -czf "ai-friend${{ env.ENV_SUFFIX }}-linux-${{ matrix.arch }}.tar.gz" build_dist/

      - name: Build Linux DEB & RPM Placeholders
        if: matrix.platform_name == 'linux'
        shell: bash
        run: |
          echo "DEB ${{ matrix.arch }} Placeholder" > "ai-friend${{ env.ENV_SUFFIX }}-linux-${{ matrix.arch }}.deb"
          echo "RPM ${{ matrix.arch }} Placeholder" > "ai-friend${{ env.ENV_SUFFIX }}-linux-${{ matrix.arch }}.rpm"

      # ----------------- COMPUTE CHECKSUMS & EXPORT SIZE MANIFEST -----------------
      - name: Compile Hashes & Sizes (Windows)
        if: matrix.platform_name == 'win'
        shell: pwsh
        run: |
          $files = Get-ChildItem "ai-friend${{ env.ENV_SUFFIX }}-win-${{ matrix.arch }}.*"
          $manifest = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Out-File -FilePath "$($file.FullName).sha256" -Encoding utf8
            
            $manifest += @{
              "name" = $file.Name
              "size_bytes" = $file.Length
              "sha256" = $hash
            }
          }
          $manifest | ConvertTo-Json | Out-File -FilePath "ai-friend${{ env.ENV_SUFFIX }}-win-${{ matrix.arch }}-manifest.json" -Encoding utf8

      - name: Compile Hashes & Sizes (macOS/Linux)
        if: matrix.platform_name != 'win'
        shell: bash
        run: |
          manifest="[]"
          for file in ai-friend${{ env.ENV_SUFFIX }}-${{ matrix.platform_name }}-${{ matrix.arch }}.*; do
            hash=$(sha256sum "$file" | cut -d' ' -f1)
            sha256sum "$file" > "$file.sha256"
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
            
            # Append item to JSON manifest array
            manifest=$(echo "$manifest" | jq ". += [{\"name\": \"$file\", \"size_bytes\": $size, \"sha256\": \"$hash\"}]")
          done
          echo "$manifest" > "ai-friend${{ env.ENV_SUFFIX }}-${{ matrix.platform_name }}-${{ matrix.arch }}-manifest.json"

      # ----------------- UPLOAD ALL ASSETS -----------------
      - name: Upload Matrix Packages, Checksums & Manifests to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ai-friend${{ env.ENV_SUFFIX }}-${{ matrix.platform_name }}-${{ matrix.arch }}.*
            ai-friend${{ env.ENV_SUFFIX }}-${{ matrix.platform_name }}-${{ matrix.arch }}-manifest.json

  docker-release-primary:
    needs: [release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: base
            context: ./backend
            file: ./backend/Dockerfile.base
            image_name: ai-friend-base
          - component: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image_name: ai-friend-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo
        shell: bash
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-release-advanced:
    needs: [docker-release-primary]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo
        shell: bash
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/ai-friend-full
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and Push Advanced Image (Full)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.full
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.repo.outputs.owner }}/ai-friend-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
