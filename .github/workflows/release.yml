name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Retrieve full history for git log computation

      - name: Generate Advanced Categorized Changelog
        id: changelog
        shell: bash
        run: |
          git fetch --tags --force
          CURRENT_TAG=${{ github.ref_name }}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")

          echo "### 🚀 Release $CURRENT_TAG - Release Notes" > release_notes.md
          echo "" >> release_notes.md

          # Compute Git Logs
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"%s (%h)")
          else
            COMMITS=$(git log $PREVIOUS_TAG..$CURRENT_TAG --oneline --pretty=format:"%s (%h)")
          fi

          # Initialize Categories
          FEATS=""
          FIXES=""
          PERFS=""
          REFACTORS=""
          DOCS=""
          CHORES=""

          # Parse and group commits
          IFS=$'\n'
          for commit in $COMMITS; do
            if [[ "$commit" =~ ^feat ]]; then
              FEATS="$FEATS* $commit\n"
            elif [[ "$commit" =~ ^fix ]]; then
              FIXES="$FIXES* $commit\n"
            elif [[ "$commit" =~ ^perf ]]; then
              PERFS="$PERFS* $commit\n"
            elif [[ "$commit" =~ ^refactor ]]; then
              REFACTORS="$REFACTORS* $commit\n"
            elif [[ "$commit" =~ ^docs ]]; then
              DOCS="$DOCS* $commit\n"
            else
              CHORES="$CHORES* $commit\n"
            fi
          done

          # Write Sections
          if [ ! -z "$FEATS" ]; then
            echo -e "### ✨ Features\n$FEATS" >> release_notes.md
          fi
          if [ ! -z "$FIXES" ]; then
            echo -e "### 🐛 Bug Fixes\n$FIXES" >> release_notes.md
          fi
          if [ ! -z "$PERFS" ]; then
            echo -e "### ⚡ Performance\n$PERFS" >> release_notes.md
          fi
          if [ ! -z "$REFACTORS" ]; then
            echo -e "### 🔨 Refactoring\n$REFACTORS" >> release_notes.md
          fi
          if [ ! -z "$DOCS" ]; then
            echo -e "### 📝 Documentation\n$DOCS" >> release_notes.md
          fi
          if [ ! -z "$CHORES" ]; then
            echo -e "### ⚙️ Maintenance & Tooling\n$CHORES" >> release_notes.md
          fi

          # Ensure trailing newline and pipe to GITHUB_OUTPUT
          echo "" >> release_notes.md
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -dc 'a-zA-Z0-9')
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: AI Friend ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: false

  build-assets:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Application Directory Structure
        shell: bash
        run: |
          mkdir -p build_dist/backend
          mkdir -p build_dist/frontend

          # Copy source trees
          cp -r backend/app build_dist/backend/
          cp LICENSE build_dist/ 2>/dev/null || true

      - name: Generate Software Bill of Materials (SBOM)
        shell: bash
        run: |
          cat <<EOF > build_dist/sbom.json
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.4",
            "serialNumber": "urn:uuid:3e078c50-d4cf-4ca6-8f3e-52b04f76d2a2",
            "version": 1,
            "metadata": {
              "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
              "component": {
                "bom-ref": "ai-friend",
                "name": "ai-friend",
                "version": "${{ github.ref_name }}",
                "type": "application"
              }
            },
            "components": [
              {
                "bom-ref": "python",
                "type": "programming-language",
                "name": "python",
                "version": "3.11"
              },
              {
                "bom-ref": "fastapi",
                "type": "library",
                "name": "fastapi",
                "version": "0.109.0"
              },
              {
                "bom-ref": "nextjs",
                "type": "library",
                "name": "nextjs",
                "version": "14.1.0"
              },
              {
                "bom-ref": "livekit-rtc",
                "type": "library",
                "name": "livekit-rtc",
                "version": "0.8.0"
              }
            ],
            "dependencies": [
              {
                "ref": "ai-friend",
                "dependsOn": [
                  "python",
                  "fastapi",
                  "nextjs",
                  "livekit-rtc"
                ]
              }
            ]
          }
          EOF

      - name: Generate Offline CHANGELOG.md
        shell: bash
        run: |
          git fetch --tags --force
          CURRENT_TAG=${{ github.ref_name }}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")

          echo "# Changelog - $CURRENT_TAG" > build_dist/CHANGELOG.md
          echo "" >> build_dist/CHANGELOG.md

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial release of AI Friend!" >> build_dist/CHANGELOG.md
            echo "" >> build_dist/CHANGELOG.md
            git log --oneline --pretty=format:"* %s (%h)" >> build_dist/CHANGELOG.md
          else
            echo "Commits since previous release ($PREVIOUS_TAG):" >> build_dist/CHANGELOG.md
            echo "" >> build_dist/CHANGELOG.md
            git log $PREVIOUS_TAG..$CURRENT_TAG --oneline --pretty=format:"* %s (%h)" >> build_dist/CHANGELOG.md
          fi

      - name: Generate Release Metadata JSON
        shell: bash
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat <<EOF > build_dist/metadata.json
          {
            "version": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "timestamp": "$TIMESTAMP"
          }
          EOF

      - name: Package Archives
        shell: bash
        run: |
          # Package zip for Windows
          cd build_dist
          zip -r ../ai-friend-windows.zip *

          # Package zip for macOS
          zip -r ../ai-friend-macos.zip *

          # Package tar.gz for Linux
          tar -czf ../ai-friend-linux.tar.gz *
          cd ..

      - name: Generate Checksums & Manifest
        shell: bash
        run: |
          manifest="[]"
          for file in ai-friend-windows.zip ai-friend-macos.zip ai-friend-linux.tar.gz; do
            hash=$(sha256sum "$file" | cut -d' ' -f1)
            echo "$hash  $file" > "$file.sha256"
            size=$(stat -c%s "$file")
            manifest=$(echo "$manifest" | jq ". += [{\"name\": \"$file\", \"size_bytes\": $size, \"sha256\": \"$hash\"}]")
          done
          echo "$manifest" > ai-friend-release-manifest.json

      - name: Upload Packages, Checksums & Manifest to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ai-friend-windows.zip
            ai-friend-windows.zip.sha256
            ai-friend-macos.zip
            ai-friend-macos.zip.sha256
            ai-friend-linux.tar.gz
            ai-friend-linux.tar.gz.sha256
            ai-friend-release-manifest.json

  docker-release-primary:
    needs: [release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: base
            context: ./backend
            file: ./backend/Dockerfile.base
            image_name: ai-friend-base
          - component: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image_name: ai-friend-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo
        shell: bash
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-release-advanced:
    needs: [docker-release-primary]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo
        shell: bash
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/ai-friend-full
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and Push Advanced Image (Full)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.full
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.repo.outputs.owner }}/ai-friend-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
