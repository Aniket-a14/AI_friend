name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Retrieve full history for git log computation

      - name: Generate Dynamic Commit Changelog
        id: changelog
        shell: bash
        run: |
          # Fetch all tags to resolve the previous release tag
          git fetch --tags
          
          # Get current tag
          CURRENT_TAG=${{ github.ref_name }}
          
          # Find the previous release tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")
          
          echo "### 🚀 What's Changed in $CURRENT_TAG" > release_notes.md
          echo "" >> release_notes.md
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial release of AI Friend!" >> release_notes.md
            echo "" >> release_notes.md
            git log --oneline --pretty=format:"* %s (%h)" >> release_notes.md
          else
            echo "Commits since previous release ($PREVIOUS_TAG):" >> release_notes.md
            echo "" >> release_notes.md
            git log $PREVIOUS_TAG..$CURRENT_TAG --oneline --pretty=format:"* %s (%h)" >> release_notes.md
          fi
          
          # Save changelog body into github output env
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -dc 'a-zA-Z0-9')
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: AI Friend ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: false

  build-assets:
    needs: [release]
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform_name: win
            archive_name: ai-friend-win.zip
          - os: macos-latest
            platform_name: macos
            archive_name: ai-friend-macos.zip
          - os: ubuntu-latest
            platform_name: linux
            archive_name: ai-friend-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Retrieve full history for changelog generation

      - name: Build Application Directory Structure
        shell: bash
        run: |
          mkdir -p build_dist/backend
          mkdir -p build_dist/frontend
          
          # Copy backend & frontend source trees
          cp -r backend/app build_dist/backend/
          cp backend/requirements*.txt build_dist/backend/ 2>/dev/null || true
          cp -r frontend/src build_dist/frontend/ 2>/dev/null || true
          cp frontend/package*.json build_dist/frontend/ 2>/dev/null || true
          
          # Add LICENSE file for legal compliance
          cp LICENSE build_dist/ 2>/dev/null || true

      - name: Generate Offline CHANGELOG.md
        shell: bash
        run: |
          git fetch --tags
          CURRENT_TAG=${{ github.ref_name }}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")
          
          echo "# Changelog - $CURRENT_TAG" > build_dist/CHANGELOG.md
          echo "" >> build_dist/CHANGELOG.md
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial release of AI Friend!" >> build_dist/CHANGELOG.md
            echo "" >> build_dist/CHANGELOG.md
            git log --oneline --pretty=format:"* %s (%h)" >> build_dist/CHANGELOG.md
          else
            echo "Commits since previous release ($PREVIOUS_TAG):" >> build_dist/CHANGELOG.md
            echo "" >> build_dist/CHANGELOG.md
            git log $PREVIOUS_TAG..$CURRENT_TAG --oneline --pretty=format:"* %s (%h)" >> build_dist/CHANGELOG.md
          fi

      - name: Generate Release Metadata JSON
        shell: bash
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat <<EOF > build_dist/metadata.json
          {
            "version": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "timestamp": "$TIMESTAMP",
            "platform": "${{ matrix.platform_name }}"
          }
          EOF

      - name: Compress Platform Archive (Windows)
        if: matrix.platform_name == 'win'
        shell: pwsh
        run: |
          Compress-Archive -Path build_dist\* -DestinationPath ${{ matrix.archive_name }}

      - name: Compress Platform Archive (macOS)
        if: matrix.platform_name == 'macos'
        shell: bash
        run: |
          zip -r ${{ matrix.archive_name }} build_dist/*

      - name: Compress Platform Archive (Linux)
        if: matrix.platform_name == 'linux'
        shell: bash
        run: |
          tar -czf ${{ matrix.archive_name }} build_dist/

      - name: Generate SHA256 Checksum (Windows)
        if: matrix.platform_name == 'win'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path ${{ matrix.archive_name }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive_name }}" | Out-File -FilePath ${{ matrix.archive_name }}.sha256 -Encoding utf8

      - name: Generate SHA256 Checksum (macOS/Linux)
        if: matrix.platform_name != 'win'
        shell: bash
        run: |
          sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Upload Platform Package & Checksum to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  docker-release-primary:
    needs: [release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: base
            context: ./backend
            file: ./backend/Dockerfile.base
            image_name: ai-friend-base
          - component: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image_name: ai-friend-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo
        shell: bash
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-release-advanced:
    needs: [docker-release-primary]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo
        shell: bash
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/ai-friend-full
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and Push Advanced Image (Full)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.full
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.repo.outputs.owner }}/ai-friend-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
