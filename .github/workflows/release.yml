name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: AI Friend ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## AI Friend Version 2.2.0 - "The Enterprise Era"
            
            This release marks the major milestone of transforming AI Friend into a truly human-like AI companion.
            
            ### 🌟 Key Features:
            - **Imperfect Memory (Memory v2)**: Short-term, Blurry, and Core memory layers.
            - **Biological Clock**: Temporal awareness and simulated biological rhythms.
            - **Dynamic Identity**: Personality and history derived purely from JSON configurations.
            - **Human Growth Engine**: Session reflection and persistent learning.
            - **Jalandhar Local Integration**: Deep localized personality and linguistic vibe.
            
            ### ⚙️ Automation:
            - Integrated GitHub Action for CI (Testing/Validation).
            - Automated Release generation on Tag push.
            - **New**: Automated Docker image publishing to GHCR.

  docker-release-primary:
    needs: [release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: base
            context: ./backend
            file: ./backend/Dockerfile.base
            image_name: ai-friend-base
          - component: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image_name: ai-friend-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-release-advanced:
    needs: [docker-release-primary]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-friend-full
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest

      - name: Build and Push Advanced Image (Full)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.full
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/ai-friend-base:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
