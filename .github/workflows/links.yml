name: Links

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 0 * * 0" # Run weekly

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          args: --verbose --no-progress --max-retries 3 --retry-wait-time 2 --timeout 20 --accept 200,403,429 --exclude "https://doi.org/.*" --exclude-path .agent --exclude-path .agents --exclude-path .claude --exclude-path .gemini --exclude-path .github/skills '*.md' '**/*.md'
          fail: true
