name: 🤖 Claude PR Review

# Automated review on every PR. Complements (does not replace) CodeRabbit and Codex:
# those catch generic defects well, but this project's characteristic failure mode is
# narrower and nastier -- code that reports success for work it did not do. The prompt
# below is aimed squarely at that.
#
# REQUIRES a repository secret named ANTHROPIC_API_KEY (Settings -> Secrets and
# variables -> Actions). Without it every run fails at the action step.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Cancel a superseded review when new commits land, so a force-push does not leave
# two reviews racing on the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip drafts: they churn, and a review per push would be noise.
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so the review can diff against the base branch and read the
          # .agents/CONTEXT.md ledger for prior decisions.
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing the AI Friend cognitive voice system: a Python
            cognitive core, Rust audio/STT crates (`backend/crates/`), and a Next.js
            frontend, wired over NATS JetStream.

            Read `.agents/CONTEXT.md` first. It is the project's evidence ledger and
            the most honest record of what is real versus aspirational. The README is
            polished and has historically overstated completeness -- when they
            disagree, trust the ledger and say so.

            ## What this codebase actually gets wrong

            Prioritise these. They are not hypothetical; every one has shipped here:

            1. **Success reported for work that did not happen.** An exporter that
               wrote text files named `*.onnx` and logged "exported successfully". A
               `synthesize()` returning `Ok(empty_audio)` for text it could not
               pronounce, so the agent silently went mute. Treat any success log,
               `Ok(())`, or empty-collection return that does not correspond to real
               work as a defect.

            2. **Silent tolerance of missing or malformed inputs.** `if let Ok(..)`
               around a required file, leaving an empty lookup table that renders
               silence. Swallowed errors that turn a hard failure into a quiet wrong
               answer. Prefer loud failure; flag anything that degrades invisibly.

            3. **Code that contradicts its own comment or doc.** A partial queue
               documented "newest wins" while `try_send` kept the oldest. If a comment
               states a guarantee, verify the code provides it.

            4. **Producer/consumer contract drift across the Python/Rust boundary.**
               A field published at the top level in Rust but read from `metadata[..]`
               in Python looks wired and carries nothing. Trace fields end to end.

            5. **Mock/benchmark logic reachable from production paths.** Hardcoded
               corpus-specific constants, synonym maps, or magic numbers tuned to a
               benchmark. Any measurement produced through such a path is not
               evidence; say so plainly.

            6. **Unverifiable claims in docs.** Latency/accuracy numbers, `[TBP]`
               placeholders presented as achievements, citations that cannot be
               located. If a PR asserts a measurement, ask what produced it.

            Also cover ordinary correctness: concurrency and shared-state races,
            async tasks blocking the runtime, NATS ack/redelivery handling, resource
            leaks, panics on untrusted input (mesh payloads are NOT trusted), and
            missing test coverage for the behaviour being changed.

            ## How to report

            - Verify each finding against the actual code before reporting it. A
              wrong finding costs more than a missed one.
            - State the concrete failure: the input or state, and the resulting wrong
              behaviour. "This could be racy" is not a finding.
            - Inline comments for specific defects; one top-level summary.
            - Distinguish what you verified from what you suspect.
            - If the diff is sound, say so briefly rather than inventing nits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cargo:*),Bash(rg:*)"
