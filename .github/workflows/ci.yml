name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Frontend Lint
      run: |
        cd frontend
        npm ci
        npm run lint
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Backend Lint
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  frontend-build:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    - name: Build
      run: |
        cd frontend
        npm run build

  backend-test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Start NATS Service
      run: |
        docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:latest -js -m 8222
        # Wait for NATS to be ready
        for i in {1..10}; do
          if wget --no-verbose --tries=1 --spider http://localhost:8222/healthz; then
            echo "NATS is ready!"
            exit 0
          fi
          echo "Waiting for NATS..."
          sleep 2
        done
        echo "NATS failed to start"
        exit 1
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    - name: Setup NATS Streams
      env:
        NATS_URL: nats://localhost:4222
      run: |
        cd backend
        python scripts/setup_nats_streams.py
    - name: Run Test Suite
      env:
        NATS_URL: nats://localhost:4222
      run: |
        cd backend
        pytest -v --tb=short
