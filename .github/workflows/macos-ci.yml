name: 🍏 macOS Compatibility CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'docker-compose.infra.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.macos*.yml'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'docker-compose.infra.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.macos*.yml'
      - '.github/workflows/macos-ci.yml'

permissions:
  contents: read

jobs:
  backend-macos:
    name: Backend Lint + Tests (macOS)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-base.txt

      - name: Install NATS server
        run: brew install nats-server

      - name: Start NATS (JetStream enabled)
        run: |
          nats-server -js -p 4222 -m 8222 > /tmp/nats.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8222/healthz > /dev/null; then
              echo "✅ NATS is ready"
              exit 0
            fi
            echo "⏳ Waiting for NATS... ($i/20)"
            sleep 1
          done
          echo "❌ NATS failed to start"
          cat /tmp/nats.log || true
          exit 1

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Cargo Check Rust Workspace
        run: |
          cd backend
          cargo check --workspace
      - name: Cargo Test Rust Workspace (audit/ROADMAP.md P2-11)
        run: |
          cd backend
          # Two invocations, not one `--workspace` run: unifying features
          # across every crate in a single `cargo test --workspace` breaks
          # cognitive-rust's PyO3 extension-module link step (a `pyo3`
          # feature-unification interaction with the other crates' own
          # dependency graphs, not anything specific to this workspace's
          # code) even though every crate passes cleanly on its own. Splitting
          # cognitive-rust into its own `--lib`-only invocation avoids the
          # combination that breaks, without silently dropping coverage.
          # See the 2026-08-23 P2-11 ledger entry for the full account,
          # including the invalid-codesign-signature root cause `build.rs`
          # now fixes for stt-agent (the SIGKILL that made this whole step
          # impossible to add before now).
          cargo test --package stt-agent --package voice-agent --package contracts
          cargo test --package cognitive-rust --lib
      - name: Build cognitive-rust extension
        run: |
          cd backend
          pip install maturin
          maturin build --manifest-path crates/cognitive-rust/Cargo.toml --out target/wheels
          pip install target/wheels/*.whl

      - name: Setup NATS streams
        env:
          NATS_URL: nats://localhost:4222
        run: |
          cd backend
          python scripts/bootstrap/setup_nats_streams.py

      - name: Backend lint (ruff)
        run: |
          cd backend
          ruff check app/ tests/ --output-format=github

      - name: Backend tests
        env:
          NATS_URL: nats://localhost:4222
          LIVEKIT_API_KEY: dummy_key
          LIVEKIT_API_SECRET: dummy_secret
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: dummy_password
        run: |
          cd backend
          pytest -q --cov=app --cov-report=term-missing
