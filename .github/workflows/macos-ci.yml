name: 🍏 macOS Compatibility CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'docker-compose.infra.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.macos*.yml'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'docker-compose.infra.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.macos*.yml'
      - '.github/workflows/macos-ci.yml'

permissions:
  contents: read

jobs:
  backend-macos:
    name: Backend Lint + Tests (macOS)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements-base.txt

      - name: Install NATS server
        run: brew install nats-server

      - name: Start NATS (JetStream enabled)
        run: |
          nats-server -js -p 4222 -m 8222 > /tmp/nats.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8222/healthz > /dev/null; then
              echo "✅ NATS is ready"
              exit 0
            fi
            echo "⏳ Waiting for NATS... ($i/20)"
            sleep 1
          done
          echo "❌ NATS failed to start"
          cat /tmp/nats.log || true
          exit 1

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Setup NATS streams
        env:
          NATS_URL: nats://localhost:4222
        run: |
          cd backend
          python scripts/bootstrap/setup_nats_streams.py

      - name: Backend lint (ruff)
        run: |
          cd backend
          ruff check app/ tests/ --output-format=github

      - name: Backend tests
        env:
          NATS_URL: nats://localhost:4222
          LIVEKIT_API_KEY: dummy_key
          LIVEKIT_API_SECRET: dummy_secret
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: dummy_password
        run: |
          cd backend
          pytest -q --cov=app --cov-report=term-missing
