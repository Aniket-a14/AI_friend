name: 🤖 Claude (on demand)

# On-demand Claude. Mention `@claude` in a PR comment, an issue, or a review comment
# and it responds in thread -- useful for "why does this fail?", "implement this
# review comment", or a targeted question the automatic review did not cover.
#
# The automatic per-PR review lives in claude-review.yml; this one only ever runs
# when a human explicitly asks for it.
#
# REQUIRES the ANTHROPIC_API_KEY repository secret.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only react to an explicit @claude mention, and never to a bot's own words --
    # CodeRabbit and Codex both comment here, and without this guard their reviews
    # could trigger Claude, which could in turn trigger them.
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cargo:*),Bash(rg:*)"
