# P2-1 (opt-in): per-agent NATS users with least-privilege subject
# permissions, verified against a real nats-server (2.14.5) -- see
# backend/tests/test_nats_accounts_enforcement.py, which boots one from this
# exact file and proves a scoped user really cannot publish or subscribe
# outside its own grant, not just that the syntax parses.
#
# OPT-IN, NOT DEFAULT: docker-compose.infra.yml's `nats` service still runs
# with no `-c` flag and no auth, exactly as before this file existed. To
# enable this, an operator must both start nats-server with
# `-c nats-accounts.conf` (or add `include` to an existing server config)
# AND set matching `NATS_USER`/`NATS_PASSWORD` env vars on every agent
# container/process -- BaseAgent.connect (Python) and the two Rust agents
# only add credentials to their connection when both env vars are present;
# with neither set, every client connects exactly as it did before this
# file existed. Passwords below are placeholders ("changeme_<agent>") for
# the same reason .env.example's are -- replace them before any real
# deployment.
#
# SCOPE, STATED PLAINLY: this is a data-plane boundary, not a control-plane
# one. Every agent's `_bootstrap_mesh` (app/agents/base.py) calls
# `jsm.add_stream`/`reconcile_existing_stream` on every startup -- stream
# and consumer administration is JetStream's own `$JS.API.>` subject space,
# and every agent genuinely needs it to self-heal a fresh or drifted mesh.
# Narrowing that per-agent would break the self-healing bootstrap the mesh
# already relies on, so `$JS.API.>` (publish) and `_INBOX.>` (subscribe, for
# JetStream's request-reply responses) are granted to everyone below. What
# this file actually gates is which *business* subjects -- chat.output,
# audio.stream, vision.description, and so on -- each agent can publish to
# or receive: a compromised or misbehaving vision_agent still cannot forge a
# chat.output message claiming to be the brain, or eavesdrop on synthesized
# speech on audio.stream it has no reason to ever see.
#
# KNOWN LIMITATION, OBSERVED DIRECTLY (not assumed): a denied *subscribe*
# does not raise synchronously on the caller -- `nc.subscribe(...)` returns
# normally, and the denial surfaces only through the registered `error_cb`
# (`BaseAgent._on_nats_error`, which logs at ERROR level). A denied
# *publish* through JetStream does raise on the caller (the ack request
# times out), because the message is silently dropped server-side and never
# reaches a stream to ack. A grant that is wrong in the too-narrow direction
# therefore fails as a logged error and a quietly-deaf subscription, not a
# crash -- watch the log, this file does not make misconfiguration loud on
# its own.
#
# TLS is deliberately not included -- deferred until the mesh crosses a
# machine boundary (the robot-plus-server split), which plaintext
# credentials over a loopback/private Docker network do not need yet.

# Empty on purpose: enables JetStream (matching docker-compose.infra.yml's
# `-js` flag) without pinning a store_dir here, so a `-sd <path>` command-line
# flag -- e.g. a test's own tmp_path -- can set one without the "duplicate
# store_dir configuration" parse error a hardcoded value here would cause.
jetstream {}

authorization {
  users = [
    { user: "brain_agent", password: "changeme_brain_agent", permissions: {
        publish: {
          allow: ["$JS.API.>", "chat.output", "audio.stop", "state.broadcast", "cache.sync"]
        }
        subscribe: {
          allow: ["_INBOX.>", "cache.sync", "chat.input", "vision.frames",
                   "vision.description", "voice.segmentation_feedback",
                   "user.voice.properties", "audio.playback.progress", "audio.stop"]
        }
    }},
    { user: "subconscious_agent", password: "changeme_subconscious_agent", permissions: {
        publish: {
          allow: ["$JS.API.>", "chat.input", "state.subconscious"]
        }
        subscribe: {
          allow: ["_INBOX.>", "cache.sync", "system.tick", "chat.input",
                   "state.broadcast", "audio.perception", "vision.description"]
        }
    }},
    { user: "surfacing_agent", password: "changeme_surfacing_agent", permissions: {
        publish: {
          allow: ["$JS.API.>", "agent.voice.modulation", "memory.surfaced"]
        }
        subscribe: {
          allow: ["_INBOX.>", "cache.sync", "chat.input", "system.tick", "state.update"]
        }
    }},
    { user: "system_agent", password: "changeme_system_agent", permissions: {
        publish: {
          allow: ["$JS.API.>", "system.tick"]
        }
        subscribe: {
          allow: ["_INBOX.>", "cache.sync"]
        }
    }},
    { user: "transport_agent", password: "changeme_transport_agent", permissions: {
        publish: {
          allow: ["$JS.API.>", "audio.inbound", "audio.playback.progress"]
        }
        subscribe: {
          allow: ["_INBOX.>", "cache.sync", "audio.stream", "audio.stop"]
        }
    }},
    { user: "vision_agent", password: "changeme_vision_agent", permissions: {
        publish: {
          allow: ["$JS.API.>", "vision.frames", "vision.description"]
        }
        subscribe: {
          allow: ["_INBOX.>", "cache.sync", "vision.control", "chat.input", "chat.output"]
        }
    }},
    # Rust agents connect via async-nats directly, not through BaseAgent, so
    # they never auto-subscribe to cache.sync -- omitted for these two,
    # deliberately, not by oversight.
    { user: "stt_agent", password: "changeme_stt_agent", permissions: {
        publish: {
          allow: ["$JS.API.>", "ambient.noise.telemetry", "audio.perception",
                   "audio.stop", "chat.input", "user.voice.properties"]
        }
        subscribe: {
          allow: ["_INBOX.>", "audio.inbound"]
        }
    }},
    { user: "voice_agent", password: "changeme_voice_agent", permissions: {
        publish: {
          allow: ["$JS.API.>", "audio.stream", "audio.playback.visemes"]
        }
        subscribe: {
          allow: ["_INBOX.>", "chat.output", "agent.voice.modulation",
                   "ambient.noise.telemetry", "audio.resume", "audio.stop",
                   "vision.description"]
        }
    }},
  ]
}
