services:
  # Light mode focuses on cognitive/state services and keeps expensive
  # real-time media services disabled unless explicitly requested.
  livekit:
    profiles: ["heavy"]

  transport_agent:
    profiles: ["heavy"]

  stt_agent:
    profiles: ["heavy"]

  gpt-sovits:
    profiles: ["heavy"]

  voice_agent:
    profiles: ["heavy"]

  rust_voice_agent:
    profiles: ["rust-voice"]

  rust_stt_agent:
    profiles: ["rust-stt"]

  ollama:
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      NVIDIA_VISIBLE_DEVICES: ""
      NVIDIA_DRIVER_CAPABILITIES: ""
