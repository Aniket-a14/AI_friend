services:
  # Heavy mode enables local cognitive and STT/voice runtimes.
  # GPT-SoVITS remains excluded here because its default image is CUDA-oriented.
  ollama:
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      NVIDIA_VISIBLE_DEVICES: ""
      NVIDIA_DRIVER_CAPABILITIES: ""

  brain_agent:
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  subconscious_agent:
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  surfacing_agent:
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gpt-sovits:
    profiles: ["linux-gpu"]

  voice_agent:
    profiles: ["linux-gpu"]
