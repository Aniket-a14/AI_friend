services:
  # Light mode focuses on cognitive/state services and keeps expensive
  # real-time media services disabled unless explicitly requested.
  livekit:
    profiles: ["heavy"]

  transport_agent:
    profiles: ["heavy"]

  stt_agent:
    profiles: ["heavy"]

  gpt-sovits:
    profiles: ["heavy"]

  voice_agent:
    profiles: ["heavy"]

  ollama:
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      NVIDIA_VISIBLE_DEVICES: ""
      NVIDIA_DRIVER_CAPABILITIES: ""

  brain_agent:
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  subconscious_agent:
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  surfacing_agent:
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
